name: Build Cube Run

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build (NO signing)
        run: |
          xcodebuild \
            -scheme "Cube Run Build Mode" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Archive
        run: |
          xcodebuild \
            -scheme "Cube Run Build Mode" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath build/CubeRun.xcarchive \
            archive

      - name: Upload Archive (ALWAYS)
        uses: actions/upload-artifact@v4
        with:
          name: CubeRun-Archive
          path: build/CubeRun.xcarchive

      # Unsigned archives contain no development team; Xcode export always needs
      # signing for an IPA. This zip is the account-free installable-ish output.
      - name: Package unsigned app from archive
        run: |
          set -euo pipefail
          APP=$(ls build/CubeRun.xcarchive/Products/Applications/*.app | head -n1)
          echo "Zipping: $APP"
          (cd "$(dirname "$APP")" && zip -qr "$GITHUB_WORKSPACE/build/CubeRunUnsignedApp.zip" "$(basename "$APP")")
          ls -la build/CubeRunUnsignedApp.zip

      - name: Upload unsigned app zip
        uses: actions/upload-artifact@v4
        with:
          name: CubeRun-UnsignedApp
          path: build/CubeRunUnsignedApp.zip

      # Best-effort only: succeeds only when the archive was signed with a team
      # (not the case for CODE_SIGNING_ALLOWED=NO). Kept per project spec.
      - name: Export IPA (requires signed archive / team)
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>debugging</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/CubeRun.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist || echo "IPA export failed (expected without signing team), continuing..."

      - name: Upload IPA (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: CubeRun-IPA
          path: build/*.ipa
          if-no-files-found: ignore
